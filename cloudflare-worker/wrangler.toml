name = "pga-refresh-worker"
main = "src/index.js"
# Pin the compatibility date — keeps the worker behaviour stable even if
# Cloudflare ships breaking runtime updates later.
compatibility_date = "2025-09-23"

# Cron triggers fire `scheduled()` in src/index.js.
# Free tier minimum interval is 1 minute. Each tick POSTs a single
# workflow_dispatch to GitHub; the workflow's concurrency group
# (cancel-in-progress: false) deduplicates if a previous build is
# still running, so a slow run just causes the next dispatch to
# replace the pending one instead of piling up.
[triggers]
crons = ["* * * * *"]

# Secrets are intentionally NOT defined here. Set them after deploy:
#   wrangler secret put GITHUB_TOKEN     ← required
#   wrangler secret put TRIGGER_SECRET   ← optional (for /trigger HTTP)
#
# Anything in this file is committed to git; secrets must NEVER be.

# Cloudflare's observability — we get scheduled-event logs visible via
# `wrangler tail` and in the Workers dashboard, which makes it easy to
# confirm the cron is firing and the GitHub API call is succeeding.
[observability]
enabled = true
