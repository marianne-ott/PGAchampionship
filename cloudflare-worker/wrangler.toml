name = "pga-refresh-worker"
main = "src/index.js"
# Pin the compatibility date — keeps the worker behaviour stable even if
# Cloudflare ships breaking runtime updates later.
compatibility_date = "2025-09-23"

# Cron triggers fire `scheduled()` in src/index.js.
# Free tier minimum interval is 1 minute. The worker now serves data
# directly (ESPN → worker → browser) instead of nudging GitHub Pages
# to rebuild, so the every-3-minute Pages-rate-limit-imposed ceiling
# no longer applies — each tick just refreshes the worker's own edge
# cache, which is unmetered.
[triggers]
crons = ["* * * * *"]

# Secrets are intentionally NOT defined here. Set them after deploy if
# needed — none are required for the current ESPN-based data path:
#   wrangler secret put POOL_CONFIG_URL  ← optional override; default
#                                          fetches pool.json from the
#                                          public raw GitHub URL.
#
# The previous workflow_dispatch path required GITHUB_TOKEN; we no
# longer dispatch GH Actions from here, so that secret can be deleted
# from the deployed worker (`wrangler secret delete GITHUB_TOKEN`).
#
# Anything in this file is committed to git; secrets must NEVER be.

# Cloudflare's observability — we get scheduled-event logs visible via
# `wrangler tail` and in the Workers dashboard, which makes it easy to
# confirm the cron is firing and the GitHub API call is succeeding.
[observability]
enabled = true
