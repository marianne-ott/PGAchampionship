name: Refresh leaderboard and deploy

on:
  schedule:
    # Always-on baseline: runs at minutes :00, :05, :10, … :55. 5-minute
    # floor is the minimum GitHub Actions allows, and `schedule` events
    # are best-effort — GH silently drops triggers when its scheduler is
    # busy. The real cadence during the tournament comes from the
    # Cloudflare Worker (cloudflare-worker/, every 3 min) firing
    # workflow_dispatch; this cron is the safety net that keeps things
    # ticking if the worker is down or after the worker's cutoff.
    #
    # We previously also ran a `2-59/5` tournament-burst cron in parallel
    # for ~2-3 min cadence, and bumped the worker to every minute on top
    # of that. Combined that pushed us to ~80 Pages deploys/hour and
    # tripped GitHub Pages' soft ~10/hr publish cap — the API kept
    # returning `success` but the live site froze for hours on a stale
    # artifact. The worker-only 3-min cadence is the sustainable middle
    # ground.
    - cron: "0-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static snapshot (docs/data.json)
        # If the upstream source is briefly unreachable we keep the previous
        # committed docs/data.json so the site never goes blank.
        run: |
          python3 build_static.py || echo "::warning::build_static.py failed; falling back to existing docs/data.json"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
