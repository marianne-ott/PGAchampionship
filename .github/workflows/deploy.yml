name: Refresh leaderboard and deploy

on:
  schedule:
    # Every-5-minute baseline rebuild of docs/data.json from ESPN (see
    # `build_static.py` → `espn_poll.py`). This is a *fallback* feed for
    # the live site: the front-end normally fetches straight from the
    # Cloudflare Worker (cloudflare-worker/, also ESPN-backed) which
    # refreshes every minute. If the worker is unreachable, the page
    # falls back to this static data.json, so we keep it reasonably fresh
    # on its own. 5 min is the floor GitHub Actions cron allows.
    #
    # History note: we previously had a separate workflow_dispatch loop
    # firing every 1-3 min to drive Pages rebuilds at near-live cadence.
    # That overran GitHub Pages' soft ~10-deploys/hour publish cap and
    # the site silently froze on a stale artifact for hours. Moving the
    # data path into the worker itself decouples refresh from publish
    # and lets this cron stay relaxed.
    - cron: "0-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static snapshot (docs/data.json)
        # If the upstream source is briefly unreachable we keep the previous
        # committed docs/data.json so the site never goes blank.
        run: |
          python3 build_static.py || echo "::warning::build_static.py failed; falling back to existing docs/data.json"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
